{{ define "main" }}
  <div class="news-shell wrap">
    <header class="directory-header">
      <p class="eyebrow">Browse by subject</p>
      <h1>{{ .Title }}</h1>
      <p>Choose a topic to see its latest articles and videos.</p>
    </header>
    <div class="topic-directory">
      {{ range .Data.Terms.ByCount }}
        <article class="topic-card">
          <div>
            <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></h2>
            <p>{{ .Count }} {{ if eq .Count 1 }}story{{ else }}stories{{ end }}</p>
          </div>
          <div class="topic-card__actions">
            <a class="button" href="{{ .Page.RelPermalink }}">Browse topic</a>
          </div>
        </article>
      {{ end }}
    </div>
  </div>
{{ end }}
