name: Get and commit latest news 
  
on:  
  schedule:  
    - cron:  '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PERSONAL_TOKEN }}
  
    - name: Set up Python  
      uses: actions/setup-python@v5
      with:  
        python-version: '3.x'
        cache: pip
  
    - name: Install dependencies  
      run: |  
        python -m pip install --upgrade pip  
        pip install -r requirements.txt   

    - name: Archive existing news
      run: python archive.py
  
    - name: Clean old news 
      run: |  
        python clean-news.py  

    - name: Refresh feed list
      run: |  
        python feeds.py  

    - name: Get latest news
      run: |  
        python news.py  

    - name: Refresh metadata archive
      run: python archive.py

    - name: Commit changes
      run: | 
        git config --local user.email "action@github.com"  
        git config --local user.name "GitHub Action"  
        git add site/dotnetramblings/content/post site/dotnetramblings/content/feeds.md site/dotnetramblings/static/archive.json
        if ! git diff --staged --quiet; then
          git add site/dotnetramblings/data/feed_health.json
          git commit -m "Automated script execution"
        fi
      
    - name: Push changes
      run: git push origin HEAD:main
