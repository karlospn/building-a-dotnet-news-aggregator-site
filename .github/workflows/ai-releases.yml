name: Refresh .NET AI releases

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect stable .NET AI releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ai_releases.py

      - name: Commit release data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add site/dotnetramblings/data/ai_releases.json
          git diff --staged --quiet || git commit -m "Refresh .NET AI release radar"

      - name: Push changes
        run: git push origin HEAD:main
