name: Get and commit latest videos 
  
on:  
  schedule:  
    - cron:  '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PERSONAL_TOKEN }}
  
    - name: Set up Python  
      uses: actions/setup-python@v5
      with:  
        python-version: '3.x'
        cache: pip
  
    - name: Install dependencies  
      run: |  
        python -m pip install --upgrade pip  
        pip install -r requirements.txt   

    - name: Archive existing videos
      run: python archive.py
  
    - name: Clean old videos 
      run: |  
        python clean-videos.py  

    - name: Get latest videos
      env:  
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  
      run: |  
        python youtube.py  

    - name: Refresh metadata archive
      run: python archive.py

    - name: Commit changes
      run: | 
        git config --local user.email "action@github.com"  
        git config --local user.name "GitHub Action"  
        git add site/dotnetramblings/content/videos site/dotnetramblings/static/archive.json
        if ! git diff --staged --quiet; then
          git add site/dotnetramblings/data/feed_health.json
          git commit -m "Automated script execution"
        fi
      
    - name: Push changes
      run: git push origin HEAD:main
