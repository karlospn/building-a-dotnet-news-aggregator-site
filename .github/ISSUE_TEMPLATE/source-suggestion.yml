name: Suggest a source
description: Suggest an RSS feed or YouTube channel for .NET Ramblings.
title: "Source suggestion: "
body:
  - type: input
    id: name
    attributes:
      label: Source name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: RSS feed or YouTube channel URL
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why is this useful to .NET developers?
      description: Describe its specialties and optionally link to an example article or video.
    validations:
      required: true
